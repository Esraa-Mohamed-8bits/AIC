# ============================================================
#  AIEEEs Tracker — Configuration
#  MTC-AIC4 Phase I
# ============================================================

# ---- Confidence thresholds ----
tracking_threshold: 0.45       # Min score to call CSRT output valid
reinit_threshold:   0.60       # Min grid-search score to reinitialise CSRT
update_threshold:   0.92       # Min score to add a frame to the template bank

# ---- Template bank ----
max_templates:      8
template_diversity: 0.12       # Cosine-distance threshold for a new template to be "diverse"

# ---- Scale control ----
max_scale_change:   1.08       # Max per-frame scale change factor
min_box_size:       15         # Minimum bounding-box side length (px)
max_box_size:       900        # Maximum bounding-box side length (px)

# ---- Motion / Kalman ----
motion_history:     6          # Velocity window length (frames)
motion_weight:      0.75       # Blend weight: 0 = ignore velocity, 1 = pure prediction

# ---- Search grid ----
grid_sizes:
  tracking:   3
  searching:  5
  desperate:  7
search_throttle:    3          # Run expensive grid search every N frames when lost

# ---- Out-of-view handling ----
border_zone:        60         # px from edge considered "border"
exit_memory:        40         # Frames to remember an exit direction after re-entry

# ---- Feature extraction ----
resize_dim: [256, 256]         # Resize patches to this before MobileNet

# ---- Latency / efficiency ----
latency_budget_ms:       25    # Hard per-frame budget; skip search if exceeded
max_lost_before_freeze:  15    # Frames lost before switching to pure Kalman propagation
feature_update_interval: 3     # Call MobileNet every N frames during normal tracking

# ---- Dynamic reinit thresholds (frames_lost → threshold) ----
dynamic_reinit_thresholds:
  20: 0.40
  50: 0.30

# ---- Object-size profiles ----
#   tiny  : area < 0.5 % of frame
#   large : area > 10  % of frame
#   medium: everything else
size_profiles:
  tiny:
    area_max:      0.005
    grid:          3
    throttle:      2
    use_mobilenet: false
  large:
    area_min:      0.10
    grid:          3
    throttle:      5
    use_mobilenet: false
  medium:
    grid:          5
    throttle:      3
    use_mobilenet: true
